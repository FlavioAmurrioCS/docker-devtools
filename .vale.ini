StylesPath = .vale-styles
MinAlertLevel = suggestion

# The style pack is gitignored and fetched by `vale sync`, which
# scripts/prose-lint.sh runs automatically when .vale-styles is missing.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells
